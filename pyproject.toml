[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "siespbip"
version = "1.0.0"
description = "Estándar y CLI para proyectos PBIP construidos con Matrícula y Titulados SIES"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.4.2",
  "pandas==2.3.2",
  "PyYAML==6.0.2",
  "jsonschema==4.25.1",
  "reportlab==5.0.1"
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.9.0",
  "pytest==9.0.3"
]

[project.scripts]
siespbip = "siespbip.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".pbi", ".sies-local", ".sies-work", "__pycache__"]

[tool.setuptools.packages.find]
include = ["siespbip*"]
