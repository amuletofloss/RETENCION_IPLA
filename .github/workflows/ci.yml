name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: .uv-cache

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar uv
        run: python -m pip install "uv==0.11.25"
      - name: Sincronizar entorno bloqueado
        run: uv sync --extra dev --locked
      - name: Compilar y validar estructura
        run: |
          uv run python -m compileall -q siespbip tests
          uv run python -m siespbip doctor
          node --check scripts/construir_pbip.mjs
          node --check scripts/visuales.mjs

  fixture-pipeline:
    name: fixture-pipeline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.11.25"
      - run: uv sync --extra dev --locked
      - name: Probar workspace y fuentes SIES sintéticas
        run: uv run pytest -q tests/standard

  project-tests:
    name: project-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.11.25"
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q

  generated:
    name: generated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.11.25"
      - run: uv sync --extra dev --locked
      - name: Comprobar contrato y árbol limpio
        run: |
          uv run pytest -q tests/standard/test_cli.py
          git diff --exit-code

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.11.25"
      - run: uv sync --locked
      - name: Bloquear microdatos, RUT y celdas pequeñas
        run: uv run python -m siespbip validate --profile source

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.11.25"
      - run: uv sync --extra dev --locked
      - run: uv run pip-audit

  gate:
    name: gate
    if: always()
    needs: [static, fixture-pipeline, project-tests, generated, privacy, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todos los jobs
        if: >-
          needs.static.result != 'success' ||
          needs.fixture-pipeline.result != 'success' ||
          needs.project-tests.result != 'success' ||
          needs.generated.result != 'success' ||
          needs.privacy.result != 'success' ||
          needs.dependency-audit.result != 'success'
        run: exit 1
